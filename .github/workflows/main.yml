name: Build locsim Rootless

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rootless.yml"
      - "Makefile"
      - "*.m"
      - "*.h"
      - "control"
      - "layout/**"

permissions:
  contents: read

jobs:
  build:
    name: locsim-rootless
    runs-on: macos-15

    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout locsim
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew install ldid dpkg make

          sudo git clone --recursive --quiet \
            https://github.com/theos/theos.git \
            "$THEOS"

          sudo chown -R "$(id -un)" "$THEOS"

      - name: Install iOS SDK
        run: |
          set -euo pipefail

          curl -fL \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz

          sudo mkdir -p "$THEOS/sdks"

          sudo tar -xJf \
            "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

          echo "Available SDKs:"
          ls -lah "$THEOS/sdks"

      - name: Fix legacy locsim Makefile
        run: |
          set -euo pipefail

          echo "===== ORIGINAL MAKEFILE ====="
          cat Makefile
          echo "============================="

          # Remove old hard-coded Xcode/toolchain settings.
          sed -i '' \
            '/Xcode11\.xctoolchain/d' \
            Makefile

          sed -i '' \
            '/^export[[:space:]].*TOOLCHAIN/d' \
            Makefile || true

          sed -i '' \
            '/^[[:space:]]*TOOLCHAIN[[:space:]]*=/d' \
            Makefile || true

          sed -i '' \
            '/^[[:space:]]*THEOS_PACKAGE_SCHEME[[:space:]]*=/d' \
            Makefile || true

          sed -i '' \
            '/^[[:space:]]*ARCHS[[:space:]]*=/d' \
            Makefile || true

          sed -i '' \
            '/^[[:space:]]*TARGET[[:space:]]*=/d' \
            Makefile || true

          # Put our modern build configuration at the TOP so Theos sees it
          # before any includes are evaluated.
          {
            echo 'THEOS_PACKAGE_SCHEME = rootless'
            echo 'ARCHS = arm64'
            echo 'TARGET = iphone:clang:16.5:15.0'
            echo ''
            cat Makefile
          } > Makefile.new

          mv Makefile.new Makefile

          echo
          echo "===== PATCHED MAKEFILE ====="
          cat Makefile
          echo "============================"

      - name: Verify compiler
        run: |
          set -euo pipefail

          echo "Apple clang:"
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos clang --version

          echo
          echo "Checking for leftover Xcode11 references..."

          if grep -R "Xcode11.xctoolchain" . \
            --exclude-dir=.git \
            --exclude="build-rootless.yml"; then
            echo "::error::A legacy Xcode11 toolchain reference still exists."
            exit 1
          fi

          echo "No legacy Xcode11 toolchain references found."

      - name: Build locsim rootless
        run: |
          set -euo pipefail

          export THEOS="$THEOS"

          make clean || true

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64 \
            TARGET=iphone:clang:16.5:15.0

      - name: Find generated package
        run: |
          set -euo pipefail

          echo "Generated DEBs:"

          find . \
            -type f \
            -name "*.deb" \
            -print

          DEB_COUNT="$(
            find . \
              -type f \
              -name "*.deb" \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::No DEB package was generated."
            exit 1
          fi

      - name: Collect package
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find . \
            -type f \
            -name "*.deb" \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo "Final package:"
          ls -lah "$GITHUB_WORKSPACE/artifacts"

      - name: Upload locsim rootless
        uses: actions/upload-artifact@v6
        with:
          name: locsim-rootless
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7
