name: Build locsim Rootless

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"
      - "Makefile"
      - "*.m"
      - "*.h"
      - "control"
      - "layout/**"

permissions:
  contents: read

jobs:
  build:
    name: locsim-rootless
    runs-on: macos-15

    env:
      THEOS: /opt/theos

    steps:
      # -------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------
      - name: Checkout locsim
        uses: actions/checkout@v5

      # -------------------------------------------------------
      # 2. Install build dependencies + Theos
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail

          brew install ldid dpkg make

          echo "Installing Theos..."

          sudo git clone --recursive --quiet \
            https://github.com/theos/theos.git \
            "$THEOS"

          sudo chown -R "$(id -un)" "$THEOS"

          echo "Theos installed:"
          ls -lah "$THEOS"

      # -------------------------------------------------------
      # 3. Install iOS SDK
      # -------------------------------------------------------
      - name: Install iOS SDK
        run: |
          set -euo pipefail

          echo "Downloading iOS 16.5 SDK..."

          curl -fL \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz

          sudo mkdir -p "$THEOS/sdks"

          sudo tar -xJf \
            "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

          echo
          echo "Available SDKs:"
          ls -lah "$THEOS/sdks"

      # -------------------------------------------------------
      # 4. Remove locsim's old Xcode 11 configuration
      # -------------------------------------------------------
      - name: Fix legacy locsim Makefile
        run: |
          set -euo pipefail

          echo "===== ORIGINAL MAKEFILE ====="
          cat Makefile
          echo "============================="

          # Remove references to the ancient Xcode 11 toolchain.
          sed -i '' \
            '/Xcode11\.xctoolchain/d' \
            Makefile

          # Remove existing TOOLCHAIN overrides.
          sed -i '' \
            '/^export[[:space:]].*TOOLCHAIN/d' \
            Makefile || true

          sed -i '' \
            '/^[[:space:]]*TOOLCHAIN[[:space:]]*=/d' \
            Makefile || true

          # Remove existing package scheme.
          sed -i '' \
            '/^[[:space:]]*THEOS_PACKAGE_SCHEME[[:space:]]*=/d' \
            Makefile || true

          # Remove existing architecture configuration.
          sed -i '' \
            '/^[[:space:]]*ARCHS[[:space:]]*=/d' \
            Makefile || true

          # Remove existing TARGET configuration.
          sed -i '' \
            '/^[[:space:]]*TARGET[[:space:]]*=/d' \
            Makefile || true

          # Create modern rootless configuration.
          {
            echo 'THEOS_PACKAGE_SCHEME = rootless'
            echo 'ARCHS = arm64'
            echo 'TARGET = iphone:clang:16.5:15.0'
            echo ''
            cat Makefile
          } > Makefile.new

          mv Makefile.new Makefile

          echo
          echo "===== PATCHED MAKEFILE ====="
          cat Makefile
          echo "============================="

      # -------------------------------------------------------
      # 5. Verify we're using modern Apple clang
      # -------------------------------------------------------
      - name: Verify compiler
        run: |
          set -euo pipefail

          echo "Apple clang:"
          xcrun --sdk iphoneos --find clang

          echo
          xcrun --sdk iphoneos clang --version

          echo
          echo "Checking source/build configuration for legacy Xcode11 references..."

          if grep -R "Xcode11.xctoolchain" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=.theos; then

            echo "::error::A legacy Xcode11 toolchain reference still exists."
            exit 1

          fi

          echo
          echo "No legacy Xcode11 references found."
          echo "Compiler configuration looks good."

      # -------------------------------------------------------
      # 6. Clean previous build
      # -------------------------------------------------------
      - name: Clean
        run: |
          set -euo pipefail

          export THEOS="$THEOS"

          make clean || true

          rm -rf packages
          rm -rf artifacts

      # -------------------------------------------------------
      # 7. Build locsim
      # -------------------------------------------------------
      - name: Build locsim rootless
        run: |
          set -euo pipefail

          export THEOS="$THEOS"

          echo "Starting rootless locsim build..."
          echo
          echo "THEOS=$THEOS"
          echo "ARCHS=arm64"
          echo "TARGET=iphone:clang:16.5:15.0"
          echo "SCHEME=rootless"
          echo

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64 \
            TARGET=iphone:clang:16.5:15.0

      # -------------------------------------------------------
      # 8. Locate generated DEB
      # -------------------------------------------------------
      - name: Find generated package
        run: |
          set -euo pipefail

          echo "Searching for generated DEB packages..."
          echo

          find . \
            -type f \
            -name "*.deb" \
            -print

          DEB_COUNT="$(
            find . \
              -type f \
              -name "*.deb" \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "DEB count: $DEB_COUNT"

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::No DEB package was generated."
            exit 1
          fi

      # -------------------------------------------------------
      # 9. Collect artifact
      # -------------------------------------------------------
      - name: Collect package
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find . \
            -type f \
            -name "*.deb" \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo
          echo "===== FINAL ARTIFACTS ====="

          ls -lah "$GITHUB_WORKSPACE/artifacts"

          echo "==========================="

      # -------------------------------------------------------
      # 10. Upload artifact
      # -------------------------------------------------------
      - name: Upload locsim rootless
        uses: actions/upload-artifact@v6
        with:
          name: locsim-rootless
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7
