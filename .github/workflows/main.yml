name: Build locsim Rootless

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"
      - "Makefile"
      - "*.m"
      - "*.h"
      - "control"
      - "layout/**"

permissions:
  contents: read

jobs:
  build:
    name: locsim-rootless
    runs-on: macos-15

    env:
      THEOS: /opt/theos

    steps:
      # =======================================================
      # 1. CHECKOUT
      # =======================================================
      - name: Checkout locsim
        uses: actions/checkout@v5

      # =======================================================
      # 2. INSTALL DEPENDENCIES + THEOS
      # =======================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          echo "Installing build dependencies..."

          brew install ldid dpkg make

          echo
          echo "Installing Theos..."

          sudo git clone --recursive --quiet \
            https://github.com/theos/theos.git \
            "$THEOS"

          sudo chown -R "$(id -un)" "$THEOS"

          echo
          echo "Theos installed successfully."

          ls -lah "$THEOS"

      # =======================================================
      # 3. INSTALL iOS SDK
      # =======================================================
      - name: Install iOS SDK
        run: |
          set -euo pipefail

          echo "Downloading iOS 16.5 SDK..."

          curl -fL \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz

          sudo mkdir -p "$THEOS/sdks"

          sudo tar -xJf \
            "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

          echo
          echo "Available SDKs:"

          ls -lah "$THEOS/sdks"

      # =======================================================
      # 4. PATCH OLD LOCSIM MAKEFILE
      # =======================================================
      - name: Fix legacy locsim Makefile
        run: |
          set -euo pipefail

          echo "================================"
          echo "ORIGINAL MAKEFILE"
          echo "================================"

          cat Makefile

          echo
          echo "================================"
          echo "PATCHING..."
          echo "================================"

          # Remove old hard-coded Xcode 11 toolchain references.
          sed -i '' \
            '/Xcode11\.xctoolchain/d' \
            Makefile

          # Remove old TOOLCHAIN configuration.
          sed -i '' \
            '/^export[[:space:]].*TOOLCHAIN/d' \
            Makefile || true

          sed -i '' \
            '/^[[:space:]]*TOOLCHAIN[[:space:]]*=/d' \
            Makefile || true

          # Remove existing rootless/package scheme configuration.
          sed -i '' \
            '/^[[:space:]]*THEOS_PACKAGE_SCHEME[[:space:]]*=/d' \
            Makefile || true

          # Remove existing architecture configuration.
          sed -i '' \
            '/^[[:space:]]*ARCHS[[:space:]]*=/d' \
            Makefile || true

          # Remove existing target configuration.
          sed -i '' \
            '/^[[:space:]]*TARGET[[:space:]]*=/d' \
            Makefile || true

          # Add modern rootless configuration at the very top.
          {
            echo 'THEOS_PACKAGE_SCHEME = rootless'
            echo 'ARCHS = arm64'
            echo 'TARGET = iphone:clang:16.5:15.0'
            echo ''
            cat Makefile
          } > Makefile.new

          mv Makefile.new Makefile

          echo
          echo "================================"
          echo "PATCHED MAKEFILE"
          echo "================================"

          cat Makefile

      # =======================================================
      # 5. VERIFY COMPILER
      # =======================================================
      - name: Verify compiler
        run: |
          set -euo pipefail

          echo "Apple clang:"
          xcrun --sdk iphoneos --find clang

          echo
          xcrun --sdk iphoneos clang --version

          echo
          echo "Checking source/build configuration for legacy Xcode11 references..."

          if grep -R "Xcode11.xctoolchain" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=.theos; then

            echo "::error::A legacy Xcode11 toolchain reference still exists."
            exit 1

          fi

          echo
          echo "No legacy Xcode11 references found."
          echo "Compiler configuration looks good."

      # =======================================================
      # 6. CLEAN
      # =======================================================
      - name: Clean previous build
        run: |
          set -euo pipefail

          export THEOS="$THEOS"

          echo "Cleaning previous build..."

          make clean || true

          rm -rf packages
          rm -rf artifacts

          echo "Clean complete."

      # =======================================================
      # 7. BUILD ROOTLESS LOCSIM
      #
      # Clang 17 reports locsim's old variable `p` as:
      #
      #   -Wunused-but-set-variable
      #
      # The original project treats warnings as errors.
      #
      # We keep warnings enabled but prevent ONLY this specific
      # warning from terminating the build.
      # =======================================================
      - name: Build locsim rootless
        run: |
          set -euo pipefail

          export THEOS="$THEOS"

          echo "================================"
          echo "Starting rootless locsim build"
          echo "================================"

          echo
          echo "THEOS=$THEOS"
          echo "ARCHS=arm64"
          echo "TARGET=iphone:clang:16.5:15.0"
          echo "SCHEME=rootless"
          echo "Clang compatibility flag:"
          echo "-Wno-error=unused-but-set-variable"
          echo

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64 \
            TARGET=iphone:clang:16.5:15.0 \
            ADDITIONAL_OBJCFLAGS="-Wno-error=unused-but-set-variable"

      # =======================================================
      # 8. FIND GENERATED DEB
      # =======================================================
      - name: Find generated package
        run: |
          set -euo pipefail

          echo
          echo "================================"
          echo "Searching for generated DEBs"
          echo "================================"
          echo

          find . \
            -type f \
            -name "*.deb" \
            -print

          DEB_COUNT="$(
            find . \
              -type f \
              -name "*.deb" \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "DEB count: $DEB_COUNT"

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::No DEB package was generated."
            exit 1
          fi

          echo
          echo "Package generation successful."

      # =======================================================
      # 9. COLLECT DEB
      # =======================================================
      - name: Collect package
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find . \
            -type f \
            -name "*.deb" \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo
          echo "================================"
          echo "FINAL ARTIFACTS"
          echo "================================"

          ls -lah "$GITHUB_WORKSPACE/artifacts"

          echo "================================"

      # =======================================================
      # 10. UPLOAD DEB
      # =======================================================
      - name: Upload locsim rootless
        uses: actions/upload-artifact@v6
        with:
          name: locsim-rootless
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7
